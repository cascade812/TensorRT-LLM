metadata:
  model_name: glm_5.2_fp4
  supported_gpus:
  - GB300
hardware:
  gpus_per_node: 4
server_configs:
  # Matched TP4/EP4 cases for section 6.3 of glm_kv_cache_offload.md.
  # Run baseline and prototype cases on the same otherwise-idle node.
  - name: "glm52_fp4_tep4_64k256_baseline"
    model_name: "glm_5.2_fp4"
    tensor_parallel_size: 4
    moe_expert_parallel_size: 4
    pipeline_parallel_size: 1
    max_batch_size: 4
    max_num_tokens: 8192
    max_seq_len: 65792
    attn_backend: "TRTLLM"
    enable_chunked_prefill: true
    enable_attention_dp: false
    moe_config:
      backend: "CUTEDSL"
    cuda_graph_config:
      enable_padding: true
      max_batch_size: 4
    kv_cache_config:
      dtype: "fp8"
      enable_block_reuse: false
      max_tokens: 263168
      free_gpu_memory_fraction: 0.8
    client_configs:
      - name: "con4_iter4_64k256"
        concurrency: 4
        iterations: 4
        isl: 65536
        osl: 256
        backend: "openai"
        dataset_file: <dataset_file>

  - name: "glm52_fp4_tep4_64k256_one_group_offload"
